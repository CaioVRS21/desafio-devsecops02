apiVersion: apps/v1
kind: Deployment
metadata:
  name: desafio-devsecops02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desafio-devsecops02
  template:
    metadata:
      labels:
        app: desafio-devsecops02
    spec:
      containers:
        - name: desafio-api
          image: desafio-devsecops02:after
          ports:
            - containerPort: 3000
          securityContext:
            runAsNonRoot: true
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
